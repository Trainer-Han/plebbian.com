<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="That page doesn't exist — but the rest of Plebbian does.">
    <meta name="theme-color" content="#0f172a">
    <meta name="robots" content="noindex">

    <title>Plebbian — Page not found</title>

    <!-- Root-absolute paths throughout: GitHub Pages serves this file for a
         missing URL at ANY depth, so relative paths would break for /a/b/c. -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

    <script>
        (function () {
            try {
                var t = localStorage.getItem('pleb.theme');
                if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }());
    </script>

    <link rel="preload" href="/assets/fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/space-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-github" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7 0-.7 0-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.9 2.9 1.3 3.6 1 .1-.8.4-1.3.8-1.6-2.7-.3-5.5-1.3-5.5-6A4.7 4.7 0 0 1 6.6 8c-.2-.3-.6-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.4 11.4 0 0 1 6 0C18.3 4.5 19.3 4.8 19.3 4.8c.7 1.7.3 2.9.1 3.2a4.7 4.7 0 0 1 1.3 3.3c0 4.6-2.8 5.6-5.5 5.9.5.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3Z"/></symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
    </svg>

    <div class="bg" aria-hidden="true">
        <canvas id="dots"></canvas>
    </div>

    <main class="error-page" id="main">
        <div>
            <p class="error-code" aria-hidden="true">404</p>
            <h1>That page doesn't exist.</h1>
            <p class="hero-copy" style="margin-inline:auto;text-align:center">
                The link may be out of date, or it might never have existed.
                Either way, everything else is still here.
            </p>
            <div class="contact-actions">
                <a href="/" class="btn btn-primary">
                    Back home
                    <svg class="i" aria-hidden="true"><use href="#i-arrow-right"></use></svg>
                </a>
                <a href="/portfolio.html" class="btn btn-ghost">See the work</a>
            </div>
        </div>
    </main>

    <footer>
        <p>© <span id="year">2026</span> Plebbian. All rights reserved.</p>
        <p>Made with Pleb AI</p>
    </footer>

    <script src="/assets/app.js" defer></script>
</body>
</html>
